name: Build Dynamic Recipe Override 3.0.0

on:
  push:
    branches: [ dro-build-3.0.0 ]
    paths:
      - 'dro-build/**'
      - '.github/workflows/build-dynamic-recipe-override.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Dynamic Recipe Override sources
        shell: bash
        run: |
          cat dro-build/source.txz.b64.* | base64 --decode > /tmp/dro-src.tar.xz
          echo "3195568d7874894425d15779d648ede0cf674efee387ddc8e9f7eb6df365080e  /tmp/dro-src.tar.xz" | sha256sum --check
          rm -rf /tmp/dro-src
          mkdir -p /tmp/dro-src
          tar -xJf /tmp/dro-src.tar.xz -C /tmp/dro-src
          test -f /tmp/dro-src/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        working-directory: /tmp/dro-src
        run: gradle clean build --no-daemon --stacktrace

      - name: Collect compiled jars
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/dro-artifact
          cp /tmp/dro-src/build/libs/*.jar /tmp/dro-artifact/
          ls -lh /tmp/dro-artifact

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicRecipeOverride-1.20.1-3.0.0
          path: /tmp/dro-artifact/*.jar
          if-no-files-found: error
