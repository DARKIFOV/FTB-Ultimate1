name: Build Dynamic Recipe Override 3.2.0

on:
  push:
    branches: [ dro-build-3.2.0-ci2 ]
    paths:
      - 'dro-build/**'
      - '.github/workflows/build-dynamic-recipe-override.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Dynamic Recipe Override 3.2.0 sources
        shell: bash
        run: |
          cat dro-build/source.txz.b64.* | base64 --decode > /tmp/dro-src.tar.xz
          echo "3195568d7874894425d15779d648ede0cf674efee387ddc8e9f7eb6df365080e  /tmp/dro-src.tar.xz" | sha256sum --check
          rm -rf /tmp/dro-src
          mkdir -p /tmp/dro-src
          tar -xJf /tmp/dro-src.tar.xz -C /tmp/dro-src
          test -f /tmp/dro-src/build.gradle

          cat dro-build/v31.patch.b64.* | base64 --decode | gzip -dc > /tmp/dro-v31.patch
          cd /tmp/dro-src
          patch -p1 < /tmp/dro-v31.patch
          grep '^mod_version=3.1.0$' gradle.properties

          cd "$GITHUB_WORKSPACE"
          cat dro-build/v32.patch.b64.* | base64 --decode > /tmp/dro-v32.patch.gz
          echo "2af2a1b81a5cbf40afb2655c4825ebccc0b7b3f8ca73a15d83ffaaa9bf0eed9a  /tmp/dro-v32.patch.gz" | sha256sum --check
          gzip -dc /tmp/dro-v32.patch.gz > /tmp/dro-v32.patch
          cd /tmp/dro-src
          patch -p1 < /tmp/dro-v32.patch
          grep '^mod_version=3.2.0$' gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        working-directory: /tmp/dro-src
        run: gradle clean build --no-daemon --stacktrace

      - name: Inspect compiled jar
        if: success()
        shell: bash
        run: |
          JAR=$(find /tmp/dro-src/build/libs -maxdepth 1 -name '*.jar' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep 'dev/dynamicrecipeoverride/compat/jei/DroJeiPlugin.class'
          jar tf "$JAR" | grep 'dev/dynamicrecipeoverride/client/JeiRuntimeBridge.class'
          jar tf "$JAR" | grep 'dev/dynamicrecipeoverride/compat/DraconicFusionCompat.class'
          unzip -p "$JAR" META-INF/mods.toml | grep '3.2.0'
          sha256sum "$JAR"

      - name: Collect compiled jars
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/dro-artifact
          cp /tmp/dro-src/build/libs/*.jar /tmp/dro-artifact/
          ls -lh /tmp/dro-artifact

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicRecipeOverride-1.20.1-3.2.0
          path: /tmp/dro-artifact/*.jar
          if-no-files-found: error
