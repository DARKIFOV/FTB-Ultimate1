name: Export Dynamic Recipe Override 3.2.0 Sources

on:
  push:
    branches: [ dro-build-3.2.0-ci2 ]
    paths:
      - '.github/workflows/build-dynamic-recipe-override.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Dynamic Recipe Override 3.2.0 sources
        shell: bash
        run: |
          cat dro-build/source.txz.b64.* | base64 --decode > /tmp/dro-src.tar.xz
          echo "3195568d7874894425d15779d648ede0cf674efee387ddc8e9f7eb6df365080e  /tmp/dro-src.tar.xz" | sha256sum --check
          rm -rf /tmp/dro-src
          mkdir -p /tmp/dro-src
          tar -xJf /tmp/dro-src.tar.xz -C /tmp/dro-src
          cat dro-build/v31.patch.b64.* | base64 --decode | gzip -dc > /tmp/dro-v31.patch
          cd /tmp/dro-src
          patch -p1 < /tmp/dro-v31.patch
          cd "$GITHUB_WORKSPACE"
          cat dro-build/v32.patch.b64.* | base64 --decode > /tmp/dro-v32.patch.gz
          echo "2af2a1b81a5cbf40afb2655c4825ebccc0b7b3f8ca73a15d83ffaaa9bf0eed9a  /tmp/dro-v32.patch.gz" | sha256sum --check
          gzip -dc /tmp/dro-v32.patch.gz > /tmp/dro-v32.patch
          cd /tmp/dro-src
          patch -p1 < /tmp/dro-v32.patch
          grep '^mod_version=3.2.0$' gradle.properties
          zip -qr /tmp/DynamicRecipeOverride-1.20.1-3.2.0-sources.zip . -x 'build/*' '.gradle/*'

      - name: Upload reconstructed sources
        uses: actions/upload-artifact@v4
        with:
          name: DynamicRecipeOverride-1.20.1-3.2.0-sources
          path: /tmp/DynamicRecipeOverride-1.20.1-3.2.0-sources.zip
          if-no-files-found: error
