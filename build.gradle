plugins {
	id 'java'
	id 'com.gtnewhorizons.retrofuturagradle' version '1.4.0'
}

group = 'com.feed_the_beast.mods.ftbultimine'
version = '1.7.10-1.3.4-port.2'

base {
	archivesName = 'FTBUltimine'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

minecraft {
	mcVersion.set('1.7.10')
	username.set('Developer')
}

repositories {
	mavenCentral()
	maven {
		name = 'GTNH'
		url = uri('https://nexus.gtnewhorizons.com/repository/public/')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

processResources {
	def modVersion = project.version.toString()
	inputs.property 'version', modVersion
	inputs.property 'mcversion', '1.7.10'

	filesMatching('mcmod.info') {
		expand version: modVersion, mcversion: '1.7.10'
	}
}
